apiVersion: v1
kind: ConfigMap
metadata:
  name: debezium-mysql-connector-config
data:
  mysql-connector.json: |
    {
      "name": "mysql-connector",
      "config": {
        "connector.class": "io.debezium.connector.mysql.MySqlConnector",
        "database.hostname": "mysql-master-service",
        "database.port": "3306",
        "database.user": "debezium",
        "database.password": "debezium_password",
        "database.server.id": "184054",
        "database.server.name": "mysql-server",
        "database.include.list": "inventory",
        "table.include.list": "inventory.customers,inventory.products,inventory.orders,inventory.order_items",
        "database.history.kafka.bootstrap.servers": "kafka-service:9092",
        "database.history.kafka.topic": "schema-changes.inventory",
        "include.schema.changes": "true",
        "snapshot.mode": "initial",
        "topic.prefix": "mysql-server"
      }
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: setup-debezium-connector
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: setup-connector
        image: curlimages/curl:8.0.1
        command:
          - /bin/sh
          - -c
          - |
            echo "Waiting for Kafka Connect to be ready..."
            until curl -f http://kafka-connect-service:8083/connectors; do
              echo "Kafka Connect not ready, retrying in 10 seconds..."
              sleep 10
            done
            
            echo "Creating MySQL connector..."
            curl -i -X POST -H "Accept:application/json" -H "Content-Type:application/json" \
              http://kafka-connect-service:8083/connectors/ -d @/config/mysql-connector.json
            
            echo "Connector setup completed"
        volumeMounts:
        - name: connector-config
          mountPath: /config
      volumes:
      - name: connector-config
        configMap:
          name: debezium-mysql-connector-config