global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # MySQL Kafka Sync Tool metrics
  - job_name: 'mysql-kafka-sync-tool'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets: ['sync-tool:8080']
    scrape_interval: 5s

  # Kafka metrics (if available)
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']
    scrape_interval: 30s

  # Kafka Connect metrics (if available)
  - job_name: 'kafka-connect'
    static_configs:
      - targets: ['kafka-connect:8083']
    scrape_interval: 30s