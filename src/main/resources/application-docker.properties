# Docker profile configuration
spring.profiles.active=docker

# Kafka Configuration for Docker
spring.kafka.bootstrap-servers=kafka:29092

# MySQL Master Database Configuration for Docker
spring.datasource.master.jdbc-url=jdbc:mysql://mysql-master:3306/inventory?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.master.username=master_user
spring.datasource.master.password=master_password

# MySQL Slave Database Configuration for Docker
spring.datasource.slave.default.jdbc-url=jdbc:mysql://mysql-slave1:3306/inventory?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.slave.default.username=slave_user
spring.datasource.slave.default.password=slave_password

# Sync Tool Configuration
sync.tool.enabled=true
sync.tool.batch-size=1000
sync.tool.retry.max-attempts=3
sync.tool.retry.backoff-delay=1000
sync.tool.lag-threshold-seconds=5

# Logging Configuration for Docker
logging.level.com.mysql.sync=INFO
logging.level.root=INFO