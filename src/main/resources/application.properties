# MySQL Kafka Sync Tool Configuration

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Application Configuration
spring.application.name=mysql-kafka-sync-tool
spring.profiles.active=dev

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.client-id=mysql-sync-tool

# Kafka Consumer Configuration
spring.kafka.consumer.group-id=mysql-sync-consumers
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.isolation.level=read_committed

# Kafka Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# MySQL Master Database Configuration
spring.datasource.master.jdbc-url=jdbc:mysql://localhost:3306/master_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.master.username=master_user
spring.datasource.master.password=master_password
spring.datasource.master.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQL Slave Database Configuration Template
spring.datasource.slave.default.jdbc-url=jdbc:mysql://localhost:3307/slave_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.slave.default.username=slave_user
spring.datasource.slave.default.password=slave_password
spring.datasource.slave.default.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,metrics,prometheus,info,loggers
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Sync Tool Specific Configuration
sync.tool.enabled=true
sync.tool.batch-size=1000
sync.tool.retry.max-attempts=3
sync.tool.retry.backoff-delay=1000
sync.tool.lag-threshold-seconds=5
sync.tool.heartbeat-interval-seconds=30

# Debezium CDC Topics
sync.tool.topics.prefix=mysql-server
sync.tool.topics.include-list=inventory,orders,customers

# Logging Configuration
logging.level.com.mysql.sync=INFO
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n