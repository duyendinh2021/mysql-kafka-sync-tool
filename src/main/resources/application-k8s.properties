# Kubernetes profile configuration
spring.profiles.active=k8s

# Kafka Configuration for Kubernetes
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka-service:9092}

# MySQL Master Database Configuration for Kubernetes
spring.datasource.master.jdbc-url=${SPRING_DATASOURCE_MASTER_JDBC_URL}
spring.datasource.master.username=${SPRING_DATASOURCE_MASTER_USERNAME}
spring.datasource.master.password=${SPRING_DATASOURCE_MASTER_PASSWORD}

# MySQL Slave Database Configuration for Kubernetes
spring.datasource.slave.default.jdbc-url=${SPRING_DATASOURCE_SLAVE_DEFAULT_JDBC_URL}
spring.datasource.slave.default.username=${SPRING_DATASOURCE_SLAVE_DEFAULT_USERNAME}
spring.datasource.slave.default.password=${SPRING_DATASOURCE_SLAVE_DEFAULT_PASSWORD}

# Sync Tool Configuration
sync.tool.enabled=true
sync.tool.batch-size=1000
sync.tool.retry.max-attempts=3
sync.tool.retry.backoff-delay=1000
sync.tool.lag-threshold-seconds=5

# Connection Pool Configuration for Kubernetes
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Actuator Configuration for Kubernetes
management.endpoints.web.exposure.include=health,metrics,prometheus,info,loggers
management.endpoint.health.show-details=always
management.health.readiness-state.enabled=true
management.health.liveness-state.enabled=true

# Logging Configuration for Kubernetes
logging.level.com.mysql.sync=INFO
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n