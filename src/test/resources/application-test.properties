# Test profile configuration - remove the profiles.active line since it's automatically set

# Use embedded H2 database for testing
spring.datasource.master.jdbc-url=jdbc:h2:mem:testdb_master;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.master.username=sa
spring.datasource.master.password=
spring.datasource.master.driver-class-name=org.h2.Driver

spring.datasource.slave.default.jdbc-url=jdbc:h2:mem:testdb_slave;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.slave.default.username=sa
spring.datasource.slave.default.password=
spring.datasource.slave.default.driver-class-name=org.h2.Driver

# JPA Configuration for testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Kafka Configuration for testing (mock/embedded)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=test-consumers

# Disable auto-configuration that might cause issues in testing
spring.autoconfigure.exclude=org.springframework.kafka.annotation.KafkaBootstrapConfiguration

# Disable sync tool for testing
sync.tool.enabled=false

# Logging
logging.level.com.mysql.sync=WARN
logging.level.org.springframework.kafka=WARN
logging.level.org.springframework.boot.autoconfigure=WARN